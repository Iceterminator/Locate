<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Locate - Partage & Notation de Spots</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .bottom-sheet { transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .bottom-sheet.closed { transform: translateY(105%); }
    .leaflet-control-zoom { display: none !important; }
    .spot-marker-pin {
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); border-radius: 9999px;
      font-weight: bold; color: white; border: 2px solid white; white-space: nowrap;
      padding: 4px 8px; font-size: 11px;
    }
  </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 flex flex-col font-sans select-none overflow-hidden">

  <!-- En-tête -->
  <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between z-20 shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-teal-500 flex items-center justify-center text-white font-bold shadow-md shadow-teal-500/20">
        <i class="fa-solid fa-location-dot"></i>
      </div>
      <div>
        <h1 class="font-bold leading-none text-base">Locate</h1>
        <div class="flex items-center gap-1.5 mt-0.5">
          <span id="sync-indicator" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
          <span id="sync-text" class="text-[10px] text-slate-400">Connexion cloud...</span>
        </div>
      </div>
    </div>

    <button onclick="triggerLocate()" class="px-3 py-1.5 bg-slate-800 active:bg-slate-700 text-teal-400 border border-slate-700 rounded-full text-xs font-semibold flex items-center gap-1.5 shadow">
      <i class="fa-solid fa-location-crosshairs text-sm"></i>
      <span>Moi</span>
    </button>
  </header>

  <!-- Zone Principale : Vue Carte & Vue Liste -->
  <main class="flex-1 relative overflow-hidden">
    <!-- Carte Leaflet -->
    <div id="map-view" class="w-full h-full">
      <div id="map" class="w-full h-full bg-slate-950"></div>
      
      <div class="absolute top-3 left-1/2 -translate-x-1/2 z-[400] bg-slate-900/80 backdrop-blur px-3 py-1 rounded-full text-[11px] text-slate-300 border border-slate-700 pointer-events-none text-center shadow-lg">
        Touche la carte pour ajouter un spot ici
      </div>
    </div>

    <!-- Vue Liste -->
    <div id="list-view" class="w-full h-full bg-slate-900 overflow-y-auto p-4 pb-24 hidden space-y-3 z-10">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Tous les spots partagés</h2>
        <span id="total-spots-badge" class="text-xs bg-slate-800 text-teal-400 px-2 py-0.5 rounded-full border border-slate-700">0 spots</span>
      </div>
      <div id="spots-cards-container" class="space-y-3">
        <!-- Rempli en JS -->
      </div>
    </div>

    <!-- Bottom Sheet : Détails & Notation d'un spot -->
    <div id="spot-sheet" class="bottom-sheet closed absolute bottom-0 left-0 right-0 max-h-[85%] bg-slate-800 border-t border-slate-700 rounded-t-3xl shadow-2xl z-[500] flex flex-col p-5 pb-8 overflow-y-auto">
      <div class="w-12 h-1.5 bg-slate-600 rounded-full mx-auto mb-3 shrink-0"></div>
      
      <!-- Photo du spot si existante -->
      <div id="sheet-image-container" class="hidden mb-3">
        <img id="sheet-image" src="" alt="Photo du spot" class="w-full h-44 object-cover rounded-2xl border border-slate-700 shadow-md">
      </div>

      <div class="flex justify-between items-start mb-2">
        <div>
          <span id="sheet-category" class="text-[10px] px-2 py-0.5 rounded-md font-semibold bg-teal-900/80 text-teal-300 uppercase">Catégorie</span>
          <h3 id="sheet-title" class="text-lg font-bold text-white mt-1">Nom du Spot</h3>
        </div>
        <button onclick="closeSheet()" class="text-slate-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <p id="sheet-desc" class="text-xs text-slate-300 mb-4">Description...</p>

      <!-- Note moyenne -->
      <div class="bg-slate-900/80 rounded-2xl p-3 border border-slate-700/60 flex items-center justify-between mb-4">
        <div>
          <div class="text-2xl font-black text-amber-400 flex items-center gap-1.5">
            <span id="sheet-rating">0.0</span>
            <i class="fa-solid fa-star text-base"></i>
          </div>
          <span id="sheet-reviews-count" class="text-[11px] text-slate-400">0 avis au total</span>
        </div>
        <button onclick="openReviewModal()" class="bg-teal-500 hover:bg-teal-400 active:scale-95 text-slate-950 font-bold text-xs px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 shadow-md shadow-teal-500/20">
          <i class="fa-solid fa-pen"></i> Noter ce spot
        </button>
      </div>

      <!-- Liste des avis -->
      <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Derniers avis</h4>
      <div id="sheet-reviews-list" class="space-y-2 text-xs max-h-48 overflow-y-auto pr-1"></div>
    </div>
  </main>

  <!-- Barre de navigation inférieure -->
  <nav class="bg-slate-900 border-t border-slate-800 flex items-center justify-around py-2 px-3 z-30 shrink-0">
    <button onclick="switchTab('map')" id="nav-btn-map" class="flex flex-col items-center gap-1 text-teal-400">
      <i class="fa-solid fa-map text-lg"></i>
      <span class="text-[10px] font-medium">Carte</span>
    </button>
    <button onclick="openAddModal()" class="w-12 h-12 -mt-5 bg-teal-500 text-slate-950 rounded-full flex items-center justify-center shadow-lg shadow-teal-500/30 active:scale-90 transition">
      <i class="fa-solid fa-plus text-xl font-bold"></i>
    </button>
    <button onclick="switchTab('list')" id="nav-btn-list" class="flex flex-col items-center gap-1 text-slate-400">
      <i class="fa-solid fa-list-ul text-lg"></i>
      <span class="text-[10px] font-medium">Liste</span>
    </button>
  </nav>

  <!-- Modal : Ajouter un spot avec Photo -->
  <div id="modal-add" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[600] hidden items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-3 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-base text-white">Nouveau Spot</h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="space-y-2.5 text-xs">
        <div>
          <label class="block text-slate-400 mb-1">Nom du lieu</label>
          <input type="text" id="add-title" placeholder="Ex: Belvédère du parc" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-teal-500">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Catégorie</label>
          <select id="add-cat" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-teal-500">
            <option value="vue">🌄 Vue panoramique</option>
            <option value="detente">☕ Pause & Détente</option>
            <option value="sport">🧗 Escalade / Sport</option>
            <option value="baignade">🌊 Baignade / Plage</option>
            <option value="nature">🌳 Nature / Arbre remarquable</option>
            <option value="autre">📍 Autre</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Description courte</label>
          <textarea id="add-desc" rows="2" placeholder="Accès facile, calme, belle ombre..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-teal-500"></textarea>
        </div>

        <!-- Champ Photo -->
        <div>
          <label class="block text-slate-400 mb-1">Photo du spot (optionnel)</label>
          <label class="flex flex-col items-center justify-center border-2 border-dashed border-slate-700 hover:border-teal-500 rounded-xl p-3 cursor-pointer bg-slate-900/60 transition text-center">
            <i class="fa-solid fa-camera text-slate-400 text-lg mb-1"></i>
            <span id="photo-label-text" class="text-[11px] text-slate-300">Prendre ou choisir une photo</span>
            <input type="file" id="add-photo" accept="image/*" class="hidden" onchange="handlePhotoSelect(event)">
          </label>
          
          <!-- Prévisualisation Photo -->
          <div id="photo-preview-wrapper" class="relative hidden mt-2">
            <img id="photo-preview" src="" alt="Aperçu" class="w-full h-28 object-cover rounded-xl border border-slate-700">
            <button onclick="removeSelectedPhoto()" type="button" class="absolute top-1.5 right-1.5 w-6 h-6 bg-rose-600 text-white rounded-full flex items-center justify-center shadow">
              <i class="fa-solid fa-xmark text-xs"></i>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-slate-400 mb-1">Ta note initiale</label>
          <div class="flex gap-2 text-2xl text-amber-400" id="add-stars-container">
            <i class="fa-solid fa-star cursor-pointer" onclick="setAddRating(1)"></i>
            <i class="fa-solid fa-star cursor-pointer" onclick="setAddRating(2)"></i>
            <i class="fa-solid fa-star cursor-pointer" onclick="setAddRating(3)"></i>
            <i class="fa-solid fa-star cursor-pointer" onclick="setAddRating(4)"></i>
            <i class="fa-solid fa-star cursor-pointer" onclick="setAddRating(5)"></i>
          </div>
        </div>
      </div>

      <input type="hidden" id="add-lat">
      <input type="hidden" id="add-lng">

      <button id="btn-save-spot" onclick="saveSpotToFirebase()" class="w-full bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold py-2.5 rounded-xl transition active:scale-95 text-xs shadow-lg shadow-teal-500/20">
        Publier pour tout le monde
      </button>
    </div>
  </div>

  <!-- Modal : Ajouter un avis -->
  <div id="modal-review" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[700] hidden items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-base text-white">Ajouter un avis</h3>
        <button onclick="closeReviewModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-400 mb-1">Pseudo</label>
          <input type="text" id="rev-author" placeholder="Ton pseudo" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white focus:outline-none focus:border-teal-500">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Note</label>
          <div class="flex gap-2 text-2xl text-amber-400" id="rev-stars-container">
            <i class="fa-solid fa-star cursor-pointer" onclick="setRevRating(1)"></i>
            <i class="fa-solid fa-star cursor-pointer" onclick="setRevRating(2)"></i>
            <i class="fa-solid fa-star cursor-pointer" onclick="setRevRating(3)"></i>
            <i class="fa-solid fa-star cursor-pointer" onclick="setRevRating(4)"></i>
            <i class="fa-solid fa-star cursor-pointer" onclick="setRevRating(5)"></i>
          </div>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Commentaire</label>
          <textarea id="rev-comment" rows="2" placeholder="Superbe endroit !" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white focus:outline-none focus:border-teal-500"></textarea>
        </div>
      </div>

      <button onclick="submitReviewToFirebase()" class="w-full bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold py-2.5 rounded-xl transition active:scale-95 text-xs shadow-lg shadow-teal-500/20">
        Envoyer mon évaluation
      </button>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. CONFIGURATION FIREBASE
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyCLhb4dgaX6_WCis384aZmZjWIZliI4WpY",
      authDomain: "arbres-c66ea.firebaseapp.com",
      projectId: "arbres-c66ea",
      storageBucket: "arbres-c66ea.firebasestorage.app",
      messagingSenderId: "189662765683",
      appId: "1:189662765683:web:6494d74351c4bfb40c0006"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ==========================================
    // 2. INITIALISATION CARTE LEAFLET
    // ==========================================
    const map = L.map('map', { zoomControl: false }).setView([43.70, 7.26], 13);
    
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri',
      maxZoom: 18
    }).addTo(map);

    let markersMap = {};
    let currentSpots = [];
    let selectedSpot = null;
    let currentAddRating = 5;
    let currentRevRating = 5;
    let userLocationMarker = null;
    let currentBase64Image = null;

    const catColors = {
      vue: '#0284c7',
      detente: '#16a34a',
      sport: '#ea580c',
      baignade: '#0891b2',
      nature: '#059669',
      autre: '#64748b'
    };

    // ==========================================
    // 3. COMPRESSION & GESTION PHOTO (CANVAS)
    // ==========================================
    function handlePhotoSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          // Redimensionner à max 800px pour un poids ultra-léger (~50-80ko)
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 800;

          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          currentBase64Image = canvas.toDataURL('image/jpeg', 0.7);

          // Afficher la prévisualisation
          document.getElementById('photo-preview').src = currentBase64Image;
          document.getElementById('photo-preview-wrapper').classList.remove('hidden');
          document.getElementById('photo-label-text').innerText = "Photo sélectionnée ✓";
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function removeSelectedPhoto() {
      currentBase64Image = null;
      document.getElementById('add-photo').value = '';
      document.getElementById('photo-preview').src = '';
      document.getElementById('photo-preview-wrapper').classList.add('hidden');
      document.getElementById('photo-label-text').innerText = "Prendre ou choisir une photo";
    }

    // ==========================================
    // 4. SYNCHRONISATION EN TEMPS RÉEL (FIRESTORE)
    // ==========================================
    function setupRealtimeSync() {
      const indicator = document.getElementById('sync-indicator');
      const text = document.getElementById('sync-text');

      db.collection('spots').onSnapshot((snapshot) => {
        indicator.className = "w-2 h-2 rounded-full bg-emerald-400";
        text.innerText = "Synchronisé en direct";

        const spots = [];
        snapshot.forEach((doc) => {
          spots.push({ id: doc.id, ...doc.data() });
        });

        currentSpots = spots;
        updateUI();

        if (selectedSpot) {
          const updated = currentSpots.find(s => s.id === selectedSpot.id);
          if (updated) openSpotDetails(updated);
        }
      }, (error) => {
        indicator.className = "w-2 h-2 rounded-full bg-rose-500";
        text.innerText = "Erreur Firestore";
        console.error("Firestore sync error:", error);
      });
    }

    function calculateAverage(reviews) {
      if (!reviews || reviews.length === 0) return "0.0";
      const sum = reviews.reduce((acc, r) => acc + (parseFloat(r.rating) || 0), 0);
      return (sum / reviews.length).toFixed(1);
    }

    function updateUI() {
      Object.values(markersMap).forEach(m => map.removeLayer(m));
      markersMap = {};

      const listContainer = document.getElementById('spots-cards-container');
      listContainer.innerHTML = '';
      document.getElementById('total-spots-badge').innerText = `${currentSpots.length} spot${currentSpots.length > 1 ? 's' : ''}`;

      if (currentSpots.length === 0) {
        listContainer.innerHTML = '<div class="text-center text-slate-500 py-10 text-xs">Aucun spot partagé pour l\'instant.<br>Touche la carte pour en ajouter un !</div>';
      }

      currentSpots.forEach(spot => {
        const avg = calculateAverage(spot.reviews);
        const count = spot.reviews ? spot.reviews.length : 0;
        const color = catColors[spot.category] || '#64748b';

        // 1. Ajouter le marqueur sur la carte
        const customIcon = L.divIcon({
          className: '',
          html: `<div class="spot-marker-pin" style="background:${color}">${avg} <i class="fa-solid fa-star ml-1 text-amber-300"></i></div>`,
          iconSize: [52, 26],
          iconAnchor: [26, 13]
        });

        const marker = L.marker([spot.lat, spot.lng], { icon: customIcon }).addTo(map);
        marker.on('click', () => openSpotDetails(spot));
        markersMap[spot.id] = marker;

        // 2. Ajouter la carte dans la vue liste (avec miniature si présente)
        const card = document.createElement('div');
        card.className = "bg-slate-800/90 border border-slate-700 rounded-2xl p-3 flex items-center justify-between active:scale-[0.99] transition";
        card.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden">
            ${spot.image ? `<img src="${spot.image}" class="w-14 h-14 rounded-xl object-cover shrink-0 border border-slate-700" alt="spot">` : `
              <div class="w-14 h-14 rounded-xl bg-slate-900 border border-slate-700 flex items-center justify-center shrink-0 text-slate-600">
                <i class="fa-solid fa-image text-lg"></i>
              </div>
            `}
            <div class="overflow-hidden pr-2">
              <div class="flex items-center gap-2 mb-1">
                <span class="text-[9px] px-2 py-0.5 rounded font-semibold uppercase text-white" style="background:${color}">${spot.category || 'spot'}</span>
                <span class="text-xs font-bold text-amber-400 flex items-center gap-1">
                  ${avg} <i class="fa-solid fa-star text-[10px]"></i> (${count})
                </span>
              </div>
              <h4 class="font-bold text-sm text-white truncate">${spot.title}</h4>
              <p class="text-xs text-slate-400 truncate mt-0.5">${spot.description || 'Pas de description'}</p>
            </div>
          </div>
          <button onclick="focusSpot('${spot.id}')" class="w-8 h-8 bg-slate-700 text-teal-400 rounded-full flex items-center justify-center shrink-0 ml-2">
            <i class="fa-solid fa-arrow-right text-xs"></i>
          </button>
        `;
        listContainer.appendChild(card);
      });
    }

    // ==========================================
    // 5. GESTION DES CLICS & MODALS
    // ==========================================
    map.on('click', (e) => {
      document.getElementById('add-lat').value = e.latlng.lat;
      document.getElementById('add-lng').value = e.latlng.lng;
      removeSelectedPhoto();
      document.getElementById('modal-add').classList.remove('hidden');
      document.getElementById('modal-add').classList.add('flex');
    });

    function openAddModal() {
      const center = map.getCenter();
      document.getElementById('add-lat').value = center.lat;
      document.getElementById('add-lng').value = center.lng;
      removeSelectedPhoto();
      document.getElementById('modal-add').classList.remove('hidden');
      document.getElementById('modal-add').classList.add('flex');
    }

    function closeAddModal() {
      document.getElementById('modal-add').classList.add('hidden');
      document.getElementById('modal-add').classList.remove('flex');
      removeSelectedPhoto();
    }

    function openSpotDetails(spot) {
      selectedSpot = spot;
      document.getElementById('sheet-title').innerText = spot.title;
      document.getElementById('sheet-category').innerText = spot.category;
      document.getElementById('sheet-desc').innerText = spot.description || 'Aucune description disponible.';
      
      // Image du spot
      const imgContainer = document.getElementById('sheet-image-container');
      const imgElem = document.getElementById('sheet-image');
      if (spot.image) {
        imgElem.src = spot.image;
        imgContainer.classList.remove('hidden');
      } else {
        imgContainer.classList.add('hidden');
      }

      const avg = calculateAverage(spot.reviews);
      document.getElementById('sheet-rating').innerText = avg;
      const count = spot.reviews ? spot.reviews.length : 0;
      document.getElementById('sheet-reviews-count').innerText = `${count} avis`;

      const reviewsList = document.getElementById('sheet-reviews-list');
      reviewsList.innerHTML = '';
      if (spot.reviews && spot.reviews.length > 0) {
        spot.reviews.slice().reverse().forEach(r => {
          const item = document.createElement('div');
          item.className = "p-2.5 rounded-xl bg-slate-900 border border-slate-700/50";
          item.innerHTML = `
            <div class="flex justify-between items-center mb-1">
              <span class="font-bold text-slate-200">${r.author || 'Anonyme'}</span>
              <span class="text-amber-400 font-semibold">${r.rating} <i class="fa-solid fa-star text-[10px]"></i></span>
            </div>
            <p class="text-slate-400 text-[11px]">${r.comment || ''}</p>
          `;
          reviewsList.appendChild(item);
        });
      } else {
        reviewsList.innerHTML = '<p class="text-slate-500 italic">Soyez le premier à donner un avis !</p>';
      }

      document.getElementById('spot-sheet').classList.remove('closed');
    }

    function closeSheet() {
      document.getElementById('spot-sheet').classList.add('closed');
    }

    function focusSpot(id) {
      const spot = currentSpots.find(s => s.id === id);
      if (spot) {
        switchTab('map');
        map.setView([spot.lat, spot.lng], 16);
        openSpotDetails(spot);
      }
    }

    function switchTab(tab) {
      if (tab === 'map') {
        document.getElementById('map-view').classList.remove('hidden');
        document.getElementById('list-view').classList.add('hidden');
        document.getElementById('nav-btn-map').className = "flex flex-col items-center gap-1 text-teal-400";
        document.getElementById('nav-btn-list').className = "flex flex-col items-center gap-1 text-slate-400";
        setTimeout(() => map.invalidateSize(), 150);
      } else {
        document.getElementById('map-view').classList.add('hidden');
        document.getElementById('list-view').classList.remove('hidden');
        document.getElementById('nav-btn-map').className = "flex flex-col items-center gap-1 text-slate-400";
        document.getElementById('nav-btn-list').className = "flex flex-col items-center gap-1 text-teal-400";
        closeSheet();
      }
    }

    // ==========================================
    // 6. ENREGISTREMENT FIREBASE
    // ==========================================
    async function saveSpotToFirebase() {
      const title = document.getElementById('add-title').value.trim();
      const desc = document.getElementById('add-desc').value.trim();
      const cat = document.getElementById('add-cat').value;
      const lat = parseFloat(document.getElementById('add-lat').value);
      const lng = parseFloat(document.getElementById('add-lng').value);

      if (!title) return alert("Veuillez indiquer un titre");

      const btn = document.getElementById('btn-save-spot');
      btn.innerText = "Publication...";
      btn.disabled = true;

      const newSpot = {
        title,
        description: desc,
        category: cat,
        lat,
        lng,
        image: currentBase64Image || null,
        createdAt: new Date().toISOString(),
        reviews: [{
          author: "Créateur",
          rating: currentAddRating,
          comment: "Spot créé",
          date: new Date().toISOString()
        }]
      };

      try {
        await db.collection('spots').add(newSpot);
        closeAddModal();
        document.getElementById('add-title').value = '';
        document.getElementById('add-desc').value = '';
        removeSelectedPhoto();
      } catch (err) {
        alert("Erreur lors de l'enregistrement : " + err.message);
      } finally {
        btn.innerText = "Publier pour tout le monde";
        btn.disabled = false;
      }
    }

    function openReviewModal() {
      document.getElementById('modal-review').classList.remove('hidden');
      document.getElementById('modal-review').classList.add('flex');
    }

    function closeReviewModal() {
      document.getElementById('modal-review').classList.add('hidden');
      document.getElementById('modal-review').classList.remove('flex');
    }

    async function submitReviewToFirebase() {
      if (!selectedSpot) return;
      const author = document.getElementById('rev-author').value.trim() || 'Visiteur';
      const comment = document.getElementById('rev-comment').value.trim();

      const newReview = {
        author,
        rating: currentRevRating,
        comment,
        date: new Date().toISOString()
      };

      try {
        const docRef = db.collection('spots').doc(selectedSpot.id);
        await docRef.update({
          reviews: firebase.firestore.FieldValue.arrayUnion(newReview)
        });
        closeReviewModal();
        document.getElementById('rev-comment').value = '';
      } catch (err) {
        alert("Erreur lors de l'avis : " + err.message);
      }
    }

    // Gestion notation étoiles
    function setAddRating(n) {
      currentAddRating = n;
      const stars = document.getElementById('add-stars-container').children;
      for (let i = 0; i < 5; i++) {
        stars[i].className = i < n ? "fa-solid fa-star cursor-pointer" : "fa-regular fa-star cursor-pointer";
      }
    }

    function setRevRating(n) {
      currentRevRating = n;
      const stars = document.getElementById('rev-stars-container').children;
      for (let i = 0; i < 5; i++) {
        stars[i].className = i < n ? "fa-solid fa-star cursor-pointer" : "fa-regular fa-star cursor-pointer";
      }
    }

    // ==========================================
    // 7. GÉOLOCALISATION GPS
    // ==========================================
    let isLocating = false;

    function triggerLocate() {
      if (isLocating) return;
      if (!navigator.geolocation) {
        alert("La géolocalisation n'est pas supportée par votre navigateur.");
        return;
      }

      isLocating = true;
      const text = document.getElementById('sync-text');
      const prevText = text.innerText;
      text.innerText = "Recherche GPS...";

      function onSuccess(pos) {
        isLocating = false;
        text.innerText = prevText;
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        map.setView([lat, lng], 16);

        if (userLocationMarker) map.removeLayer(userLocationMarker);
        userLocationMarker = L.circleMarker([lat, lng], {
          radius: 9,
          fillColor: '#06b6d4',
          color: '#ffffff',
          weight: 3,
          fillOpacity: 1
        }).addTo(map);
      }

      function onError(err) {
        if (err.code === 3) {
          navigator.geolocation.getCurrentPosition(
            onSuccess,
            () => {
              isLocating = false;
              text.innerText = prevText;
              alert("Signal GPS inaccessible.");
            },
            { enableHighAccuracy: false, timeout: 10000, maximumAge: 30000 }
          );
          return;
        }

        isLocating = false;
        text.innerText = prevText;
        if (err.code === 1) {
          alert("Accès à la position refusé. Vérifiez les autorisations de votre navigateur.");
        } else {
          alert("Position momentanément indisponible.");
        }
      }

      navigator.geolocation.getCurrentPosition(onSuccess, onError, {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 10000
      });
    }

    // Démarrage de l'écoute Firestore
    setupRealtimeSync();
  </script>
</body>
