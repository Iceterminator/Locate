<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Locate - Partage & Notation de Spots</title>
  
  <!-- Métadonnées PWA & Mobile -->
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Locate">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/854/854878.png">
  <link id="manifest-placeholder" rel="manifest">

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .bottom-sheet { transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .bottom-sheet.closed { transform: translateY(105%); }
    .leaflet-control-zoom { display: none !important; }
    .spot-marker-pin {
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); border-radius: 9999px;
      font-weight: bold; color: white; border: 2px solid white; white-space: nowrap;
      padding: 4px 8px; font-size: 11px;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 flex flex-col font-sans select-none overflow-hidden">

  <!-- En-tête -->
  <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between z-20 shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-teal-500 flex items-center justify-center text-white font-bold shadow-md shadow-teal-500/20">
        <i class="fa-solid fa-location-dot"></i>
      </div>
      <div>
        <h1 class="font-bold leading-none text-base">Locate</h1>
        <div class="flex items-center gap-1.5 mt-0.5">
          <span id="sync-indicator" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
          <span id="sync-text" class="text-[10px] text-slate-400">Connexion cloud...</span>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- Bouton Installation PWA (affiché uniquement si compatible) -->
      <button id="btn-install-pwa" onclick="installPWA()" class="hidden px-2.5 py-1.5 bg-teal-500/20 text-teal-300 border border-teal-500/40 rounded-full text-xs font-semibold items-center gap-1">
        <i class="fa-solid fa-download text-xs"></i>
        <span>Installer</span>
      </button>

      <!-- Toggle Mode Consultation / Ajout -->
      <button id="btn-toggle-mode" onclick="toggleMapMode()" class="px-3 py-1.5 bg-slate-800 text-slate-300 border border-slate-700 rounded-full text-xs font-semibold flex items-center gap-1.5 transition">
        <i id="mode-icon" class="fa-solid fa-eye text-teal-400"></i>
        <span id="mode-text">Vue</span>
      </button>

      <!-- Bouton GPS -->
      <button onclick="triggerLocate()" class="px-3 py-1.5 bg-slate-800 active:bg-slate-700 text-teal-400 border border-slate-700 rounded-full text-xs font-semibold flex items-center gap-1.5 shadow">
        <i class="fa-solid fa-location-crosshairs text-sm"></i>
        <span>Moi</span>
      </button>
    </div>
  </header>

  <!-- Zone Principale : Vue Carte & Vue Liste -->
  <main class="flex-1 relative overflow-hidden">
    <!-- Vue Carte -->
    <div id="map-view" class="w-full h-full relative">
      <div id="map" class="w-full h-full bg-slate-950"></div>
      
      <!-- Indicateur du mode en cours -->
      <div id="mode-banner" class="absolute top-3 left-1/2 -translate-x-1/2 z-[400] bg-slate-900/90 backdrop-blur px-3 py-1.5 rounded-full text-[11px] border border-slate-700 pointer-events-none text-center shadow-lg flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-slate-400"></span>
        <span id="mode-banner-text" class="text-slate-300">Mode Consultation : exploration libre</span>
      </div>
    </div>

    <!-- Vue Liste avec Onglets (Tous vs Mes Spots vs Favoris) + Filtres & Tri -->
    <div id="list-view" class="w-full h-full bg-slate-900 overflow-y-auto p-4 pb-24 hidden space-y-3 z-10">
      
      <!-- Sélecteur d'onglet interne : Tous vs Mes Spots vs Favoris -->
      <div class="grid grid-cols-3 gap-1 bg-slate-950/80 p-1 rounded-xl border border-slate-800">
        <button id="subtab-all" onclick="switchListSubtab('all')" class="py-2 text-[11px] font-bold rounded-lg bg-teal-500 text-slate-950 shadow transition">
          Tous (<span id="count-all">0</span>)
        </button>
        <button id="subtab-my" onclick="switchListSubtab('my')" class="py-2 text-[11px] font-bold rounded-lg text-slate-400 hover:text-white transition">
          Mes spots (<span id="count-my">0</span>)
        </button>
        <button id="subtab-fav" onclick="switchListSubtab('fav')" class="py-2 text-[11px] font-bold rounded-lg text-slate-400 hover:text-white transition flex items-center justify-center gap-1">
          <i class="fa-solid fa-heart text-rose-500 text-[10px]"></i> Favoris (<span id="count-fav">0</span>)
        </button>
      </div>

      <!-- Filtres et Tri -->
      <div class="flex gap-2">
        <select id="filter-cat" onchange="renderLists()" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-teal-500">
          <option value="all">Toutes catégories</option>
          <option value="vue">🌄 Vues panoramiques</option>
          <option value="detente">☕ Détente</option>
          <option value="sport">🧗 Sport / Escalade</option>
          <option value="baignade">🌊 Baignade</option>
          <option value="nature">🌳 Nature</option>
          <option value="autre">📍 Autre</option>
        </select>

        <select id="sort-by" onchange="renderLists()" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-slate-200 focus:outline-none focus:border-teal-500">
          <option value="rating_desc">⭐ Meilleures notes</option>
          <option value="reviews_desc">💬 Plus d'avis</option>
          <option value="date_desc">🕒 Plus récents</option>
          <option value="title_asc">🔤 Nom (A-Z)</option>
        </select>
      </div>

      <!-- Conteneur des cartes -->
      <div id="spots-cards-container" class="space-y-3 pt-1">
        <!-- Rempli en JS -->
      </div>
    </div>

    <!-- Bottom Sheet : Détails d'un spot -->
    <div id="spot-sheet" class="bottom-sheet closed absolute bottom-0 left-0 right-0 max-h-[88%] bg-slate-800 border-t border-slate-700 rounded-t-3xl shadow-2xl z-[500] flex flex-col p-4 pb-8 overflow-y-auto">
      
      <!-- Barre d'entête de la fiche avec Favori et Croix de fermeture -->
      <div class="flex justify-between items-center mb-3">
        <button id="sheet-btn-fav" onclick="toggleFavoriteFromSheet()" class="w-8 h-8 rounded-full bg-slate-700/80 hover:bg-slate-600 active:scale-95 text-slate-400 flex items-center justify-center shadow-lg transition">
          <i class="fa-solid fa-heart text-base"></i>
        </button>
        <div class="w-10 h-1 bg-slate-600 rounded-full mx-auto"></div>
        <button onclick="closeSheet()" class="w-8 h-8 rounded-full bg-slate-700/80 hover:bg-slate-600 active:scale-95 text-slate-200 flex items-center justify-center shadow-lg">
          <i class="fa-solid fa-xmark text-base"></i>
        </button>
      </div>
      
      <!-- Carrousel de photos multiples -->
      <div id="sheet-gallery-container" class="hidden mb-3">
        <div class="relative w-full rounded-2xl overflow-hidden bg-slate-950 border border-slate-700 shadow-md">
          <img id="sheet-main-photo" src="" alt="Photo" onclick="openLightboxFromSheet()" class="w-full h-52 object-cover cursor-pointer active:opacity-90 transition">
          <span id="sheet-photo-counter" class="absolute bottom-2 right-2 bg-black/70 backdrop-blur px-2.5 py-1 rounded-full text-[10px] text-white font-medium">1 / 1</span>
        </div>
        <!-- Miniatures -->
        <div id="sheet-thumbnails" class="flex gap-2 mt-2 overflow-x-auto no-scrollbar py-1"></div>
      </div>

      <div class="flex justify-between items-start mb-2">
        <div>
          <span id="sheet-category" class="text-[10px] px-2 py-0.5 rounded-md font-semibold bg-teal-900/80 text-teal-300 uppercase">Catégorie</span>
          <h3 id="sheet-title" class="text-lg font-bold text-white mt-1">Nom du Spot</h3>
        </div>
      </div>

      <p id="sheet-desc" class="text-xs text-slate-300 mb-4">Description...</p>

      <!-- Note moyenne -->
      <div class="bg-slate-900/80 rounded-2xl p-3 border border-slate-700/60 flex items-center justify-between mb-4">
        <div>
          <div class="text-2xl font-black text-amber-400 flex items-center gap-1.5">
            <span id="sheet-rating">0.0</span>
            <i class="fa-solid fa-star text-base"></i>
          </div>
          <span id="sheet-reviews-count" class="text-[11px] text-slate-400">0 avis au total</span>
        </div>
        <button onclick="openReviewModal()" class="bg-teal-500 hover:bg-teal-400 active:scale-95 text-slate-950 font-bold text-xs px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 shadow-md shadow-teal-500/20">
          <i class="fa-solid fa-pen"></i> Noter ce spot
        </button>
      </div>

      <!-- Liste des avis -->
      <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Derniers avis</h4>
      <div id="sheet-reviews-list" class="space-y-2 text-xs max-h-48 overflow-y-auto pr-1"></div>
    </div>
  </main>

  <!-- Lightbox plein écran pour zoomer & naviguer dans les photos -->
  <div id="lightbox" class="fixed inset-0 bg-black/95 z-[900] hidden flex-col justify-between p-4 backdrop-blur-md">
    <div class="flex justify-between items-center text-white">
      <span id="lightbox-counter" class="text-xs bg-slate-800/80 px-3 py-1 rounded-full border border-slate-700">1 / 1</span>
      <button onclick="closeLightbox()" class="w-10 h-10 rounded-full bg-slate-800 text-white flex items-center justify-center text-lg shadow-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    
    <div class="flex-1 flex items-center justify-center relative my-4 overflow-hidden">
      <img id="lightbox-img" src="" class="max-h-full max-w-full object-contain rounded-lg shadow-2xl">
      <button onclick="prevLightboxImage()" class="absolute left-2 w-10 h-10 rounded-full bg-slate-800/80 text-white flex items-center justify-center shadow-lg active:scale-90">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <button onclick="nextLightboxImage()" class="absolute right-2 w-10 h-10 rounded-full bg-slate-800/80 text-white flex items-center justify-center shadow-lg active:scale-90">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <div class="text-center text-slate-400 text-xs">
      Glissez ou cliquez sur les flèches pour faire défiler
    </div>
  </div>

  <!-- Barre de navigation inférieure -->
  <nav class="bg-slate-900 border-t border-slate-800 flex items-center justify-around py-2 px-3 z-30 shrink-0">
    <button onclick="switchTab('map')" id="nav-btn-map" class="flex flex-col items-center gap-1 text-teal-400">
      <i class="fa-solid fa-map text-lg"></i>
      <span class="text-[10px] font-medium">Carte</span>
    </button>
    <button onclick="openAddModal()" class="w-12 h-12 -mt-5 bg-teal-500 text-slate-950 rounded-full flex items-center justify-center shadow-lg shadow-teal-500/30 active:scale-90 transition">
      <i class="fa-solid fa-plus text-xl font-bold"></i>
    </button>
    <button onclick="switchTab('list')" id="nav-btn-list" class="flex flex-col items-center gap-1 text-slate-400">
      <i class="fa-solid fa-list-ul text-lg"></i>
      <span class="text-[10px] font-medium">Liste</span>
    </button>
  </nav>

  <!-- Modal : Ajouter un spot (Multi-photos) -->
  <div id="modal-add" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[600] hidden items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-3 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-base text-white">Nouveau Spot</h3>
        <button onclick="closeAddModal()" class="w-8 h-8 rounded-full bg-slate-700 text-slate-300 flex items-center justify-center"><i class="fa-solid fa-xmark text-sm"></i></button>
      </div>

      <div class="space-y-2.5 text-xs">
        <div>
          <label class="block text-slate-400 mb-1">Nom du lieu</label>
          <input type="text" id="add-title" placeholder="Ex: Belvédère du parc" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-teal-500">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Catégorie</label>
          <select id="add-cat" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-teal-500">
            <option value="vue">🌄 Vue panoramique</option>
            <option value="detente">☕ Pause & Détente</option>
            <option value="sport">🧗 Escalade / Sport</option>
            <option value="baignade">🌊 Baignade / Plage</option>
            <option value="nature">🌳 Nature</option>
            <option value="autre">📍 Autre</option>
          </select>
        </div>

        <!-- Coordonnées GPS -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-slate-400">Coordonnées GPS</label>
            <button type="button" onclick="fillAddModalWithCurrentGPS()" class="text-[10px] text-teal-400 hover:text-teal-300 font-semibold flex items-center gap-1">
              <i class="fa-solid fa-location-crosshairs"></i> Ma position actuelle
            </button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <span class="text-[10px] text-slate-500 block mb-0.5">Latitude</span>
              <input type="number" step="any" id="add-lat" placeholder="46.6033" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white focus:outline-none focus:border-teal-500 text-xs">
            </div>
            <div>
              <span class="text-[10px] text-slate-500 block mb-0.5">Longitude</span>
              <input type="number" step="any" id="add-lng" placeholder="1.8883" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white focus:outline-none focus:border-teal-500 text-xs">
            </div>
          </div>
        </div>

        <div>
          <label class="block text-slate-400 mb-1">Description</label>
          <textarea id="add-desc" rows="2" placeholder="Accès facile, belle vue..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-teal-500"></textarea>
        </div>

        <!-- Section Photos multiples -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-slate-400">Photos du spot (<span id="add-photos-count">0</span>)</label>
          </div>
          <label class="flex flex-col items-center justify-center border-2 border-dashed border-slate-700 hover:border-teal-500 rounded-xl p-3 cursor-pointer bg-slate-900/60 transition text-center">
            <i class="fa-solid fa-camera text-slate-400 text-lg mb-1"></i>
            <span class="text-[11px] text-slate-300">Ajouter une ou plusieurs photos</span>
            <input type="file" id="add-photos-input" accept="image/*" multiple class="hidden" onchange="handleMultiplePhotos(event, 'add')">
          </label>
          
          <div id="add-photos-grid" class="grid grid-cols-3 gap-2 mt-2"></div>
        </div>

        <div>
          <label class="block text-slate-400 mb-1">Ta note initiale</label>
          <div class="flex gap-2 text-2xl text-amber-400" id="add-stars-container">
            <i class="fa-solid fa-star cursor-pointer" onclick="setAddRating(1)"></i>
            <i class="fa-solid fa-star cursor-pointer" onclick="setAddRating(2)"></i>
            <i class="fa-solid fa-star cursor-pointer" onclick="setAddRating(3)"></i>
            <i class="fa-solid fa-star cursor-pointer" onclick="setAddRating(4)"></i>
            <i class="fa-solid fa-star cursor-pointer" onclick="setAddRating(5)"></i>
          </div>
        </div>
      </div>

      <button id="btn-save-spot" onclick="saveSpotToFirebase()" class="w-full bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold py-2.5 rounded-xl transition active:scale-95 text-xs shadow-lg shadow-teal-500/20">
        Publier le spot
      </button>
    </div>
  </div>

  <!-- Modal : Modifier mon spot (Multi-photos) -->
  <div id="modal-edit" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[650] hidden items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-3 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-base text-white">Modifier mon Spot</h3>
        <button onclick="closeEditModal()" class="w-8 h-8 rounded-full bg-slate-700 text-slate-300 flex items-center justify-center"><i class="fa-solid fa-xmark text-sm"></i></button>
      </div>

      <input type="hidden" id="edit-spot-id">

      <div class="space-y-2.5 text-xs">
        <div>
          <label class="block text-slate-400 mb-1">Nom du lieu</label>
          <input type="text" id="edit-title" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-teal-500">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Catégorie</label>
          <select id="edit-cat" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-teal-500">
            <option value="vue">🌄 Vue panoramique</option>
            <option value="detente">☕ Pause & Détente</option>
            <option value="sport">🧗 Escalade / Sport</option>
            <option value="baignade">🌊 Baignade / Plage</option>
            <option value="nature">🌳 Nature</option>
            <option value="autre">📍 Autre</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Coordonnées GPS</label>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <span class="text-[10px] text-slate-500 block mb-0.5">Latitude</span>
              <input type="number" step="any" id="edit-lat" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white focus:outline-none focus:border-teal-500 text-xs">
            </div>
            <div>
              <span class="text-[10px] text-slate-500 block mb-0.5">Longitude</span>
              <input type="number" step="any" id="edit-lng" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white focus:outline-none focus:border-teal-500 text-xs">
            </div>
          </div>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Description</label>
          <textarea id="edit-desc" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-teal-500"></textarea>
        </div>

        <div>
          <label class="block text-slate-400 mb-1">Photos (<span id="edit-photos-count">0</span>)</label>
          <label class="flex flex-col items-center justify-center border border-dashed border-slate-700 rounded-xl p-2.5 cursor-pointer bg-slate-900/60 text-center mb-2">
            <span class="text-[11px] text-teal-400">+ Ajouter d'autres photos</span>
            <input type="file" id="edit-photos-input" accept="image/*" multiple class="hidden" onchange="handleMultiplePhotos(event, 'edit')">
          </label>
          <div id="edit-photos-grid" class="grid grid-cols-3 gap-2"></div>
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="deleteCurrentSpot()" class="flex-1 bg-rose-900/50 hover:bg-rose-800 text-rose-300 font-bold py-2.5 rounded-xl border border-rose-700/60 text-xs transition">
          Supprimer
        </button>
        <button id="btn-save-edit" onclick="saveEditedSpot()" class="flex-1 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition">
          Enregistrer
        </button>
      </div>
    </div>
  </div>

  <!-- Modal : Ajouter un avis -->
  <div id="modal-review" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[700] hidden items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-base text-white">Ajouter un avis</h3>
        <button onclick="closeReviewModal()" class="w-8 h-8 rounded-full bg-slate-700 text-slate-300 flex items-center justify-center"><i class="fa-solid fa-xmark text-sm"></i></button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-400 mb-1">Pseudo</label>
          <input type="text" id="rev-author" placeholder="Ton pseudo" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white focus:outline-none focus:border-teal-500">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Note</label>
          <div class="flex gap-2 text-2xl text-amber-400" id="rev-stars-container">
            <i class="fa-solid fa-star cursor-pointer" onclick="setRevRating(1)"></i>
            <i class="fa-solid fa-star cursor-pointer" onclick="setRevRating(2)"></i>
            <i class="fa-solid fa-star cursor-pointer" onclick="setRevRating(3)"></i>
            <i class="fa-solid fa-star cursor-pointer" onclick="setRevRating(4)"></i>
            <i class="fa-solid fa-star cursor-pointer" onclick="setRevRating(5)"></i>
          </div>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Commentaire</label>
          <textarea id="rev-comment" rows="2" placeholder="Superbe vue !" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white focus:outline-none focus:border-teal-500"></textarea>
        </div>
      </div>

  <script>
    // ==========================================
    // 0. CONFIGURATION PWA (INSTALLABLE)

    // ==========================================
    // 1. FIREBASE & USER ID & FAVORIS

    const firebaseConfig = {

      authDomain: "arbres-c66ea.firebaseapp.com",
      projectId: "arbres-c66ea",
      storageBucket: "arbres-c66ea.firebasestorage.app",
      messagingSenderId: "189662765683",
      appId: "1:189662765683:web:6494d74351c4bfb40c0006"

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let myUserId = localStorage.getItem('locate_device_uid');

    // ==========================================

      attribution: 'Esri',

    let markersMap = {};
    let currentSpots = [];
    let selectedSpot = null;
    let currentAddRating = 5;
    let currentRevRating = 5;
    let userLocationMarker = null;
    let currentSubtab = 'all'; // 'all', 'my' ou 'fav'

    let currentMapMode = 'view'; 

    let addPhotosList = [];
    let editPhotosList = [];
    let currentSheetPhotos = [];
    let currentSheetPhotoIndex = 0;
    let currentLightboxIndex = 0;

    const catColors = {
      vue: '#0284c7',
      detente: '#16a34a',
      sport: '#ea580c',
      baignade: '#0891b2',
      nature: '#059669',
      autre: '#64748b'

    // ==========================================
    // 3. GESTION DES MODES DE CARTE (AJOUT vs VUE)
    // ==========================================
    function toggleMapMode() {

        document.getElementById('btn-toggle-mode').className = "px-3 py-1.5 bg-teal-500 text-slate-950 rounded-full text-xs font-bold flex items-center gap-1.5 shadow-md shadow-teal-500/20";

        document.getElementById('mode-text').innerText = "Mode Ajout";
        
        document.getElementById('mode-banner').className = "absolute top-3 left-1/2 -translate-x-1/2 z-[400] bg-teal-950/90 border border-teal-500 backdrop-blur px-3 py-1.5 rounded-full text-[11px] pointer-events-none text-center shadow-lg flex items-center gap-2";
        document.getElementById('mode-banner').children[0].className = "w-2 h-2 rounded-full bg-teal-400 animate-pulse";
        document.getElementById('mode-banner-text').className = "text-teal-200 font-medium";

        document.getElementById('mode-banner').className = "absolute top-3 left-1/2 -translate-x-1/2 z-[400] bg-slate-900/90 backdrop-blur px-3 py-1.5 rounded-full text-[11px] border border-slate-700 pointer-events-none text-center shadow-lg flex items-center gap-2";
        document.getElementById('mode-banner').children[0].className = "w-2 h-2 rounded-full bg-slate-400";
        document.getElementById('mode-banner-text').className = "text-slate-300";
        document.getElementById('mode-banner-text').innerText = "Mode Consultation : exploration libre";
      }

    map.on('click', (e) => {
      if (currentMapMode !== 'add') return;

      document.getElementById('add-lat').value = e.latlng.lat.toFixed(6);
      document.getElementById('add-lng').value = e.latlng.lng.toFixed(6);

      document.getElementById('modal-add').classList.remove('hidden');
      document.getElementById('modal-add').classList.add('flex');
    });

    // ==========================================
    // 4. COMPRESSION ET GESTION PHOTOS
    // ==========================================
    async function compressImageFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxDim = 800;

            if (width > height && width > maxDim) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else if (height > maxDim) {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleMultiplePhotos(event, mode) {
      const files = Array.from(event.target.files);
      if (!files.length) return;

      for (const file of files) {
        const base64 = await compressImageFile(file);
        if (mode === 'add') {
          addPhotosList.push(base64);
        } else {
          editPhotosList.push(base64);
        }
      }
      renderPhotosGrid(mode);
      event.target.value = '';
    }

    function removePhotoByIndex(mode, index) {
      if (mode === 'add') {
        addPhotosList.splice(index, 1);
        renderPhotosGrid('add');
      } else {
        editPhotosList.splice(index, 1);
        renderPhotosGrid('edit');
      }
    }

    function renderPhotosGrid(mode) {
      const list = mode === 'add' ? addPhotosList : editPhotosList;
      const grid = document.getElementById(`${mode}-photos-grid`);
      document.getElementById(`${mode}-photos-count`).innerText = list.length;
      grid.innerHTML = '';

      list.forEach((imgBase64, idx) => {
        const item = document.createElement('div');
        item.className = "relative rounded-xl overflow-hidden border border-slate-700 aspect-square";
        item.innerHTML = `
          <img src="${imgBase64}" class="w-full h-full object-cover">
          <button onclick="removePhotoByIndex('${mode}', ${idx})" type="button" class="absolute top-1 right-1 w-6 h-6 bg-rose-600/90 text-white rounded-full flex items-center justify-center text-xs shadow">
            <i class="fa-solid fa-xmark"></i>
          </button>
        `;
        grid.appendChild(item);
      });
    }

    // ==========================================
    // 5. GALERIE PHOTOS ET LIGHTBOX
    // ==========================================
    function setupSheetGallery(photos) {
      const container = document.getElementById('sheet-gallery-container');
      const thumbnails = document.getElementById('sheet-thumbnails');
      currentSheetPhotos = photos || [];
      currentSheetPhotoIndex = 0;

      if (!currentSheetPhotos.length) {
        container.classList.add('hidden');
        return;
      }

      container.classList.remove('hidden');
      displaySheetPhoto(0);

      thumbnails.innerHTML = '';
      if (currentSheetPhotos.length > 1) {
        currentSheetPhotos.forEach((img, idx) => {
          const thumb = document.createElement('img');
          thumb.src = img;
          thumb.className = `w-12 h-12 rounded-xl object-cover border-2 shrink-0 cursor-pointer ${idx === 0 ? 'border-teal-400' : 'border-transparent opacity-60'}`;
          thumb.onclick = () => displaySheetPhoto(idx);
          thumbnails.appendChild(thumb);
        });
      }
    }

    function displaySheetPhoto(index) {
      currentSheetPhotoIndex = index;
      document.getElementById('sheet-main-photo').src = currentSheetPhotos[index];
      document.getElementById('sheet-photo-counter').innerText = `${index + 1} / ${currentSheetPhotos.length}`;

      const thumbs = document.getElementById('sheet-thumbnails').children;
      for (let i = 0; i < thumbs.length; i++) {
        thumbs[i].className = `w-12 h-12 rounded-xl object-cover border-2 shrink-0 cursor-pointer ${i === index ? 'border-teal-400 opacity-100' : 'border-transparent opacity-60'}`;
      }
    }

    function openLightboxFromSheet() {
      if (!currentSheetPhotos.length) return;
      currentLightboxIndex = currentSheetPhotoIndex;
      showLightboxImage();
      document.getElementById('lightbox').classList.remove('hidden');
      document.getElementById('lightbox').classList.add('flex');
    }

    function showLightboxImage() {
      document.getElementById('lightbox-img').src = currentSheetPhotos[currentLightboxIndex];
      document.getElementById('lightbox-counter').innerText = `${currentLightboxIndex + 1} / ${currentSheetPhotos.length}`;
    }

    function nextLightboxImage() {
      currentLightboxIndex = (currentLightboxIndex + 1) % currentSheetPhotos.length;
      showLightboxImage();
    }

    function prevLightboxImage() {
      currentLightboxIndex = (currentLightboxIndex - 1 + currentSheetPhotos.length) % currentSheetPhotos.length;
      showLightboxImage();
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.add('hidden');
      document.getElementById('lightbox').classList.remove('flex');
    }

    // ==========================================
    // 6. FIRESTORE SYNC & UI (SANS AUTO-OPEN)
    // ==========================================
    function setupRealtimeSync() {
      const indicator = document.getElementById('sync-indicator');
      const text = document.getElementById('sync-text');

      db.collection('spots').onSnapshot((snapshot) => {
        indicator.className = "w-2 h-2 rounded-full bg-emerald-400";
        text.innerText = "Synchronisé en direct";

        const spots = [];
        snapshot.forEach((doc) => {
          spots.push({ id: doc.id, ...doc.data() });
        });

        currentSpots = spots;
        updateMapMarkers();
        renderLists();

        // Met à jour la fiche UNIQUEMENT si l'utilisateur l'a ouverte manuellement
        const sheet = document.getElementById('spot-sheet');
        if (selectedSpot && !sheet.classList.contains('closed')) {
          const updated = currentSpots.find(s => s.id === selectedSpot.id);
          if (updated) openSpotDetails(updated);
        }
      }, (error) => {
        indicator.className = "w-2 h-2 rounded-full bg-rose-500";
        text.innerText = "Erreur Firestore";
        console.error("Firestore sync error:", error);
      });
    }

    function calculateAverage(reviews) {
      if (!reviews || reviews.length === 0) return "0.0";
      const sum = reviews.reduce((acc, r) => acc + (parseFloat(r.rating) || 0), 0);
      return (sum / reviews.length).toFixed(1);
    }

    function updateMapMarkers() {
      Object.values(markersMap).forEach(m => map.removeLayer(m));
      markersMap = {};

      currentSpots.forEach(spot => {
        const avg = calculateAverage(spot.reviews);
        const color = catColors[spot.category] || '#64748b';

        const customIcon = L.divIcon({
          className: '',
          html: `<div class="spot-marker-pin" style="background:${color}">${avg} <i class="fa-solid fa-star ml-1 text-amber-300"></i></div>`,
          iconSize: [52, 26],
          iconAnchor: [26, 13]
        });

        const marker = L.marker([spot.lat, spot.lng], { icon: customIcon }).addTo(map);
        marker.on('click', () => openSpotDetails(spot));
        markersMap[spot.id] = marker;
      });
    }

    function switchListSubtab(tab) {
      currentSubtab = tab;
      const btnAll = document.getElementById('subtab-all');
      const btnMy = document.getElementById('subtab-my');
      const btnFav = document.getElementById('subtab-fav');

      btnAll.className = "py-2 text-[11px] font-bold rounded-lg text-slate-400 hover:text-white transition";
      btnMy.className = "py-2 text-[11px] font-bold rounded-lg text-slate-400 hover:text-white transition";
      btnFav.className = "py-2 text-[11px] font-bold rounded-lg text-slate-400 hover:text-white transition flex items-center justify-center gap-1";

      if (tab === 'all') {
        btnAll.className = "py-2 text-[11px] font-bold rounded-lg bg-teal-500 text-slate-950 shadow transition";
      } else if (tab === 'my') {
        btnMy.className = "py-2 text-[11px] font-bold rounded-lg bg-teal-500 text-slate-950 shadow transition";
      } else if (tab === 'fav') {
        btnFav.className = "py-2 text-[11px] font-bold rounded-lg bg-teal-500 text-slate-950 shadow transition flex items-center justify-center gap-1";
      }
      renderLists();
    }

    function renderLists() {
      const container = document.getElementById('spots-cards-container');
      const selectedCat = document.getElementById('filter-cat').value;
      const sortBy = document.getElementById('sort-by').value;

      const mySpotsCount = currentSpots.filter(s => s.userId === myUserId).length;
      const favSpotsCount = currentSpots.filter(s => isFavorite(s.id)).length;

      document.getElementById('count-all').innerText = currentSpots.length;
      document.getElementById('count-my').innerText = mySpotsCount;
      document.getElementById('count-fav').innerText = favSpotsCount;

      let list = [];
      if (currentSubtab === 'my') {
        list = currentSpots.filter(s => s.userId === myUserId);
      } else if (currentSubtab === 'fav') {
        list = currentSpots.filter(s => isFavorite(s.id));
      } else {
        list = [...currentSpots];
      }

      if (selectedCat !== 'all') {
        list = list.filter(s => s.category === selectedCat);
      }

      list.sort((a, b) => {
        const avgA = parseFloat(calculateAverage(a.reviews)) || 0;
        const avgB = parseFloat(calculateAverage(b.reviews)) || 0;
        const countA = a.reviews ? a.reviews.length : 0;
        const countB = b.reviews ? b.reviews.length : 0;

        if (sortBy === 'rating_desc') return avgB - avgA;
        if (sortBy === 'reviews_desc') return countB - countA;
        if (sortBy === 'date_desc') return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
        if (sortBy === 'title_asc') return a.title.localeCompare(b.title);
        return 0;
      });

      container.innerHTML = '';

      if (list.length === 0) {
        let msg = "Aucun spot ne correspond à vos filtres.";
        if (currentSubtab === 'my') msg = "Vous n'avez pas encore ajouté de spot.";
        if (currentSubtab === 'fav') msg = "Aucun spot favori pour l'instant. Touchez le cœur ❤️ pour en ajouter.";
        container.innerHTML = `<div class="text-center text-slate-500 py-10 text-xs">${msg}</div>`;
        return;
      }

      list.forEach(spot => {
        const avg = calculateAverage(spot.reviews);
        const count = spot.reviews ? spot.reviews.length : 0;
        const color = catColors[spot.category] || '#64748b';
        const isMine = spot.userId === myUserId;
        const isFav = isFavorite(spot.id);

        const coverImage = (spot.images && spot.images.length > 0) ? spot.images[0] : (spot.image || null);

        const card = document.createElement('div');
        card.className = "bg-slate-800/90 border border-slate-700/80 rounded-2xl p-3 flex items-center justify-between shadow";
        card.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden cursor-pointer flex-1" onclick="focusSpot('${spot.id}')">
            ${coverImage ? `<img src="${coverImage}" class="w-14 h-14 rounded-xl object-cover shrink-0 border border-slate-700" alt="spot">` : `
              <div class="w-14 h-14 rounded-xl bg-slate-900 border border-slate-700 flex items-center justify-center shrink-0 text-slate-600">
                <i class="fa-solid fa-image text-lg"></i>
              </div>
            `}
            <div class="overflow-hidden pr-2">
              <div class="flex items-center gap-2 mb-1">
                <span class="text-[9px] px-2 py-0.5 rounded font-semibold uppercase text-white" style="background:${color}">${spot.category || 'spot'}</span>
                <span class="text-xs font-bold text-amber-400 flex items-center gap-1">
                  ${avg} <i class="fa-solid fa-star text-[10px]"></i> (${count})
                </span>
                ${isMine ? `<span class="text-[9px] bg-teal-900/60 text-teal-300 px-1.5 py-0.5 rounded border border-teal-700/50">Moi</span>` : ''}
              </div>
              <h4 class="font-bold text-sm text-white truncate">${spot.title}</h4>
              <p class="text-xs text-slate-400 truncate mt-0.5">${spot.description || 'Pas de description'}</p>
            </div>
          </div>

          <div class="flex items-center gap-1.5 ml-2">
            <button onclick="toggleFavorite('${spot.id}', event)" title="Favori" class="w-8 h-8 rounded-full ${isFav ? 'bg-rose-500/20 text-rose-500 border border-rose-500/40' : 'bg-slate-700/80 text-slate-400'} flex items-center justify-center active:scale-90 transition">
              <i class="fa-solid fa-heart text-xs"></i>
            </button>
            ${isMine ? `
              <button onclick="openEditModal('${spot.id}')" title="Modifier" class="w-8 h-8 bg-slate-700/80 active:bg-slate-600 text-amber-300 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-pen text-xs"></i>
              </button>
            ` : ''}
            <button onclick="focusSpot('${spot.id}')" title="Voir sur la carte" class="w-8 h-8 bg-slate-700 active:bg-slate-600 text-teal-400 rounded-full flex items-center justify-center">
              <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // ==========================================
    // 7. GESTION DES CLICS & MODALS
    // ==========================================
    function openAddModal() {
      const center = map.getCenter();
      document.getElementById('add-lat').value = center.lat.toFixed(6);
      document.getElementById('add-lng').value = center.lng.toFixed(6);
      addPhotosList = [];
      renderPhotosGrid('add');
      document.getElementById('modal-add').classList.remove('hidden');
      document.getElementById('modal-add').classList.add('flex');
    }

    function closeAddModal() {
      document.getElementById('modal-add').classList.add('hidden');
      document.getElementById('modal-add').classList.remove('flex');
    }

    function fillAddModalWithCurrentGPS() {
      if (!navigator.geolocation) return alert("Géolocalisation indisponible");
      navigator.geolocation.getCurrentPosition((pos) => {
        document.getElementById('add-lat').value = pos.coords.latitude.toFixed(6);
        document.getElementById('add-lng').value = pos.coords.longitude.toFixed(6);
      }, () => {
        alert("Impossible de récupérer votre position GPS actuelle.");
      }, { enableHighAccuracy: true, timeout: 10000 });
    }

    function openSpotDetails(spot) {
      selectedSpot = spot;
      document.getElementById('sheet-title').innerText = spot.title;
      document.getElementById('sheet-category').innerText = spot.category;
      document.getElementById('sheet-desc').innerText = spot.description || 'Aucune description disponible.';
      
      updateSheetFavButton();

      const photos = spot.images || (spot.image ? [spot.image] : []);
      setupSheetGallery(photos);

      const avg = calculateAverage(spot.reviews);
      document.getElementById('sheet-rating').innerText = avg;
      const count = spot.reviews ? spot.reviews.length : 0;
      document.getElementById('sheet-reviews-count').innerText = `${count} avis`;

      const reviewsList = document.getElementById('sheet-reviews-list');
      reviewsList.innerHTML = '';
      if (spot.reviews && spot.reviews.length > 0) {
        spot.reviews.slice().reverse().forEach(r => {
          const item = document.createElement('div');
          item.className = "p-2.5 rounded-xl bg-slate-900 border border-slate-700/50";
          item.innerHTML = `
            <div class="flex justify-between items-center mb-1">
              <span class="font-bold text-slate-200">${r.author || 'Anonyme'}</span>
              <span class="text-amber-400 font-semibold">${r.rating} <i class="fa-solid fa-star text-[10px]"></i></span>
            </div>
            <p class="text-slate-400 text-[11px]">${r.comment || ''}</p>
          `;
          reviewsList.appendChild(item);
        });
      } else {
        reviewsList.innerHTML = '<p class="text-slate-500 italic">Soyez le premier à donner un avis !</p>';
      }

      document.getElementById('spot-sheet').classList.remove('closed');
    }

    function closeSheet() {
      document.getElementById('spot-sheet').classList.add('closed');
      selectedSpot = null; // Évite la réouverture non désirée
    }

    function focusSpot(id) {
      const spot = currentSpots.find(s => s.id === id);
      if (spot) {
        switchTab('map');
        map.setView([spot.lat, spot.lng], 16);
        openSpotDetails(spot);
      }
    }

    function switchTab(tab) {
      if (tab === 'map') {
        document.getElementById('map-view').classList.remove('hidden');
        document.getElementById('list-view').classList.add('hidden');
        document.getElementById('nav-btn-map').className = "flex flex-col items-center gap-1 text-teal-400";
        document.getElementById('nav-btn-list').className = "flex flex-col items-center gap-1 text-slate-400";
        setTimeout(() => map.invalidateSize(), 150);
      } else {
        document.getElementById('map-view').classList.add('hidden');
        document.getElementById('list-view').classList.remove('hidden');
        document.getElementById('nav-btn-map').className = "flex flex-col items-center gap-1 text-slate-400";
        document.getElementById('nav-btn-list').className = "flex flex-col items-center gap-1 text-teal-400";
        closeSheet();
        renderLists();
      }
    }

    // ==========================================
    // 8. ÉDITION & SUPPRESSION (MES SPOTS)
    // ==========================================
    function openEditModal(spotId) {
      const spot = currentSpots.find(s => s.id === spotId);
      if (!spot || spot.userId !== myUserId) return;

      document.getElementById('edit-spot-id').value = spot.id;
      document.getElementById('edit-title').value = spot.title;
      document.getElementById('edit-cat').value = spot.category;
      document.getElementById('edit-lat').value = spot.lat;
      document.getElementById('edit-lng').value = spot.lng;
      document.getElementById('edit-desc').value = spot.description || '';

      editPhotosList = spot.images ? [...spot.images] : (spot.image ? [spot.image] : []);
      renderPhotosGrid('edit');

      document.getElementById('modal-edit').classList.remove('hidden');
      document.getElementById('modal-edit').classList.add('flex');
    }

    function closeEditModal() {
      document.getElementById('modal-edit').classList.add('hidden');
      document.getElementById('modal-edit').classList.remove('flex');
    }

    async function saveEditedSpot() {
      const id = document.getElementById('edit-spot-id').value;
      const title = document.getElementById('edit-title').value.trim();
      const desc = document.getElementById('edit-desc').value.trim();
      const category = document.getElementById('edit-cat').value;
      const lat = parseFloat(document.getElementById('edit-lat').value);
      const lng = parseFloat(document.getElementById('edit-lng').value);

      if (!title) return alert("Le nom est obligatoire");
      if (isNaN(lat) || isNaN(lng)) return alert("Coordonnées GPS invalides");

      const btn = document.getElementById('btn-save-edit');
      btn.innerText = "Enregistrement...";
      btn.disabled = true;

      try {
        await db.collection('spots').doc(id).update({
          title,
          description: desc,
          category,
          lat,
          lng,
          images: editPhotosList
        });
        closeEditModal();
      } catch (err) {
        alert("Erreur lors de la modification : " + err.message);
      } finally {
        btn.innerText = "Enregistrer";
        btn.disabled = false;
      }
    }

    async function deleteCurrentSpot() {
      const id = document.getElementById('edit-spot-id').value;
      if (!confirm("Voulez-vous vraiment supprimer ce spot ? Cette action est irréversible.")) return;

      try {
        await db.collection('spots').doc(id).delete();
        closeEditModal();
        closeSheet();
      } catch (err) {
        alert("Erreur lors de la suppression : " + err.message);
      }
    }

    // ==========================================
    // 9. PUBLICATION & AVIS FIREBASE (CORRIGÉ)
    // ==========================================
    async function saveSpotToFirebase() {
      const title = document.getElementById('add-title').value.trim();
      const desc = document.getElementById('add-desc').value.trim();
      const cat = document.getElementById('add-cat').value;
      const lat = parseFloat(document.getElementById('add-lat').value);
      const lng = parseFloat(document.getElementById('add-lng').value);

      if (!title) return alert("Veuillez indiquer un titre");
      if (isNaN(lat) || isNaN(lng)) return alert("Veuillez renseigner des coordonnées GPS valides");

      const btn = document.getElementById('btn-save-spot');
      btn.innerText = "Publication...";
      btn.disabled = true;

      const newSpot = {
        title,
        description: desc,
        category: cat,
        lat,
        lng,
        images: addPhotosList,
        userId: myUserId,
        createdAt: new Date().toISOString(),
        reviews: [{
          author: "Créateur",
          rating: currentAddRating,
          comment: "Spot créé",
          date: new Date().toISOString()
        }]
      };

      try {
        // Désactive explicitement toute sélection préalable pour ne rien ouvrir
        selectedSpot = null;
        closeSheet();

        await db.collection('spots').add(newSpot);
        
        closeAddModal();
        document.getElementById('add-title').value = '';
        document.getElementById('add-desc').value = '';
        addPhotosList = [];
        renderPhotosGrid('add');
        
        if (currentMapMode === 'add') toggleMapMode();
      } catch (err) {
        alert("Erreur lors de l'enregistrement : " + err.message);
      } finally {
        btn.innerText = "Publier le spot";
        btn.disabled = false;
      }
    }

    function openReviewModal() {
      document.getElementById('modal-review').classList.remove('hidden');
      document.getElementById('modal-review').classList.add('flex');
    }

    function closeReviewModal() {
      document.getElementById('modal-review').classList.add('hidden');
      document.getElementById('modal-review').classList.remove('flex');
    }

    async function submitReviewToFirebase() {
      if (!selectedSpot) return;
      const author = document.getElementById('rev-author').value.trim() || 'Visiteur';
      const comment = document.getElementById('rev-comment').value.trim();

      const newReview = {
        author,
        rating: currentRevRating,
        comment,
        date: new Date().toISOString()
      };

      try {
        const docRef = db.collection('spots').doc(selectedSpot.id);
        await docRef.update({
          reviews: firebase.firestore.FieldValue.arrayUnion(newReview)
        });
        closeReviewModal();
        document.getElementById('rev-comment').value = '';
      } catch (err) {
        alert("Erreur lors de l'avis : " + err.message);
      }
    }

    function setAddRating(n) {
      currentAddRating = n;
      const stars = document.getElementById('add-stars-container').children;
      for (let i = 0; i < 5; i++) {
        stars[i].className = i < n ? "fa-solid fa-star cursor-pointer" : "fa-regular fa-star cursor-pointer";
      }
    }

    function setRevRating(n) {
      currentRevRating = n;
      const stars = document.getElementById('rev-stars-container').children;
      for (let i = 0; i < 5; i++) {
        stars[i].className = i < n ? "fa-solid fa-star cursor-pointer" : "fa-regular fa-star cursor-pointer";
      }
    }

    // ==========================================
    // 10. GÉOLOCALISATION GPS
    // ==========================================
    let isLocating = false;

    function triggerLocate() {
      if (isLocating) return;
      if (!navigator.geolocation) {
        alert("La géolocalisation n'est pas supportée par votre navigateur.");
        return;
      }

      isLocating = true;
      const text = document.getElementById('sync-text');
      const prevText = text.innerText;
      text.innerText = "Recherche GPS...";

      function onSuccess(pos) {
        isLocating = false;
        text.innerText = prevText;
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        map.setView([lat, lng], 16);

        if (userLocationMarker) map.removeLayer(userLocationMarker);
        userLocationMarker = L.circleMarker([lat, lng], {
          radius: 9,
          fillColor: '#06b6d4',
          color: '#ffffff',
          weight: 3,
          fillOpacity: 1
        }).addTo(map);
      }

      function onError(err) {
        if (err.code === 3) {
          navigator.geolocation.getCurrentPosition(
            onSuccess,
            () => {
              isLocating = false;
              text.innerText = prevText;
              alert("Signal GPS inaccessible.");
            },
            { enableHighAccuracy: false, timeout: 10000, maximumAge: 30000 }
          );
          return;
        }

        isLocating = false;
        text.innerText = prevText;
        if (err.code === 1) {
          alert("Accès à la position refusé. Vérifiez les autorisations de votre navigateur.");
        } else {
          alert("Position momentanément indisponible.");
        }
      }

      navigator.geolocation.getCurrentPosition(onSuccess, onError, {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 10000
      });
    }

    // Démarrage
    setupRealtimeSync();
  </script>
</body>
